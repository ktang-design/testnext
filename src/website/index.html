<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Maze universal snippet (verifies this domain for live testing / in-product prompts) -->

    u = document.currentScript || (function () {
      var w = document.getElementsByTagName('script');
      return w[w.length - 1];
    })();
    v = u && u.nonce;

    s = a.createElement('script');
    s.src = z + '?apiKey=' + e;
    s.async = true;
    if (v) s.setAttribute('nonce', v);
    a.getElementsByTagName('head')[0].appendChild(s);
    m.mazeUniversalSnippetApiKey = e;
  })(window, document, 'https://snippet.maze.co/maze-universal-loader.js', '9efa980f-dcbb-4108-9226-7d4704c35c25');
  </script>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Builder — StacksNext</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/components/navigation/navigation.css" />
  <link rel="stylesheet" href="website.css" />
  <link rel="stylesheet" href="website-preview.css" />
  <link rel="stylesheet" href="/shared/app-shell.css" />
  <!-- No pre-paint collapse script here on purpose: arriving from the "Page
       Builder" pill in the top nav always opens the rail fully, regardless
       of whatever collapsed/expanded state the user left it in last (see
       the inline script below, which also resets the stored preference to
       match). -->
</head>
<body>
  <!-- Persistent system message (alpha notice) — always at the top of the product, not dismissible. -->
  <div class="sysmsg">
    <p class="sysmsg__text">This product is currently in alpha and under active development. The functionality and designs presented are for demonstration purposes only and may change as the product evolves.</p>
  </div>

  <header class="topnav">
    <div class="topnav__left">
      <a class="topnav__logo" href="#" aria-label="Stacks home">
        <img src="/site-details/assets/app-logo.png" alt="Stratum" width="28" height="28" />
      </a>
      <nav class="topnav__menu" aria-label="Primary">
        <a href="/website/" class="navpill navpill--active" aria-current="page">
          <span class="navpill__icon navpill__icon--website" aria-hidden="true"></span>
          <span class="navpill__label">Page Builder</span>
        </a>
        <a class="navpill" href="/features/bento/">
          <span class="navpill__icon navpill__icon--features" aria-hidden="true"></span>
          <span class="navpill__label">Tools &amp; Services</span>
        </a>
        <a class="navpill" href="/site-details/">
          <span class="navpill__icon navpill__icon--platform" aria-hidden="true"></span>
          <span class="navpill__label">System Settings</span>
        </a>
      </nav>
    </div>
    <button type="button" class="usermenu" aria-label="User menu" aria-haspopup="true">
      <img class="usermenu__avatar" src="assets/user-avatar.svg" alt="" aria-hidden="true" />
      <img class="usermenu__caret" src="/shared/chevron-down.svg" alt="" aria-hidden="true" />
    </button>
  </header>

  <div class="layout">
    <aside class="sidenav" data-website-nav aria-label="Page Builder"></aside>

    <div class="content">
      <div class="navworkspace">
        <div class="navpreview" role="img" aria-label="Live website preview">
          <div data-website-preview></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Always land with the rail open and nothing selected, regardless of
       whatever collapse preference was left by a previous visit. -->
  <script>try{document.documentElement.classList.remove('is-nav-collapsed');localStorage.setItem('pb.sidenav','expanded');}catch(e){}</script>
  <script src="/website/website-nav.js"></script>
  <script src="/shared/app-shell.js"></script>
  <script src="/shared/auth-client.js"></script>
  <script src="website-preview.js"></script>
  <script>window.WebsitePreview.create(document.querySelector('[data-website-preview]'));</script>
</body>
</html>
