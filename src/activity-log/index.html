<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activity log — StacksNext</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/components/navigation/navigation.css" />
  <link rel="stylesheet" href="/site-details/site-details.css" />
  <link rel="stylesheet" href="/platform/platform.css" />
  <link rel="stylesheet" href="/shared/app-shell.css" />
</head>
<body>
  <div class="sysmsg">
    <p class="sysmsg__text">This product is currently in alpha and under active development. The functionality and designs presented are for demonstration purposes only and may change as the product evolves.</p>
  </div>

  <header class="topnav">
    <div class="topnav__left">
      <a class="topnav__logo" href="#" aria-label="Stratum home"><img src="/site-details/assets/app-logo.png" alt="Stratum" width="28" height="28" /></a>
      <nav class="topnav__menu" aria-label="Primary">
        <a class="navpill" href="/website/pages/"><span class="navpill__icon navpill__icon--website" aria-hidden="true"></span><span class="navpill__label">Website</span></a>
        <a class="navpill" href="/features/bento/"><span class="navpill__icon navpill__icon--features" aria-hidden="true"></span><span class="navpill__label">Features</span></a>
        <button type="button" class="navpill navpill--active" aria-current="page"><span class="navpill__icon navpill__icon--platform" aria-hidden="true"></span><span class="navpill__label">Platform</span></button>
      </nav>
    </div>
    <button type="button" class="usermenu" aria-label="User menu" aria-haspopup="true">
      <img class="usermenu__avatar" src="/site-details/assets/user-avatar.svg" alt="" aria-hidden="true" />
      <img class="usermenu__caret" src="/shared/chevron-down.svg" alt="" aria-hidden="true" />
    </button>
  </header>

  <div class="layout">
    <aside class="sidenav" data-platform-nav aria-label="Settings"></aside>
    <div class="content">
      <main class="platform-page">
        <div class="section-heading">
          <div class="section-heading__text">
            <h1 class="section-heading__title">Activity log</h1>
            <p class="section-heading__desc">Track and review changes, user actions, and system events across the platform.</p>
          </div>
        </div>
        <div data-table-page></div>
      </main>
    </div>
  </div>

  <script src="/platform/platform-nav.js"></script>
  <script src="/shared/app-shell.js"></script>
  <script src="/shared/auth-client.js"></script>
  <script>
    window.PLATFORM_TABLE = {
      endpoint: '/api/platform/activity', exportPath: '/api/platform/activity/export',
      searchPlaceholder: 'Search activities',
      columns: [{ label: 'Time', width: '30%' }, { label: 'Activity' }, { label: 'User', width: '22%' }],
      getRows: function (d) { return d.events; },
      rowHtml: function (e) {
        var T = window.PlatformTable;
        var link = e.linkLabel ? (e.linkHref ? '<a href="' + T.esc(e.linkHref) + '">' + T.esc(e.linkLabel) + '</a>' : T.esc(e.linkLabel)) : '';
        return '<tr><td>' + T.fmtDate(e.createdAt) + '</td><td>' + T.esc(e.pre) + link + T.esc(e.post || '') + '</td><td>' + T.esc(e.actor) + '</td></tr>';
      }
    };
  </script>
  <script src="/platform/platform-table.js"></script>
</body>
</html>
